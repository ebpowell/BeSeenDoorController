name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  CLI_TOOLS_IMAGE: ${{ github.repository }}/cli-synch-tools
#  POSTGRES_IMAGE: ${{ github.repository }}/postgres

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: BeSeen REST API Server
            dockerfile: Dockerfile.beseen-api
            image_name: beseen-api
            context: .
          - name: BeSeen CLI Tools
            dockerfile: Dockerfile.beseen-cli
            image_name: beseen-cli
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata - ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch 
            type=semver,pattern={{version}} 
            type=semver,pattern={{major}}.{{minor}} 
            type=sha,prefix=sha-{{short_sha}} 
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image - ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  post-build-info:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Print image locations
        run: |
          echo "✅ Docker images built and pushed successfully!"
          echo ""
          echo "BeSeen REST API Server:"
          echo "  ghcr.io/${{ github.repository }}/beseen-api:latest"
          echo "  Platforms: linux/amd64, linux/arm64"
          echo ""
          echo "BeSeen CLI Tools:"
          echo "  ghcr.io/${{ github.repository }}/beseen-cli:latest"
          echo "  Platforms: linux/amd64, linux/arm64"
